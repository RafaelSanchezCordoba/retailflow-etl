[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retailflow"
version = "0.1.0"
description = "RetailFlow — end-to-end ETL/ELT pipeline (portfolio project)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/retailflow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
